name: build

on:
  schedule:
    # Daily 21:00 UTC = 05:00 CST, quiet hours on eq12
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'ssh-mcp version to build (empty = npm dist-tag latest)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Decide whether to build
        id: decide
        run: |
          NPM_LATEST=$(curl -fsSL https://registry.npmjs.org/ssh-mcp | python3 -c "import json,sys; print(json.load(sys.stdin)['dist-tags']['latest'])")
          PIN=$(sed -n 's/^ARG SSH_MCP_VERSION=//p' deploy/Dockerfile)
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
            FORCE=true
          else
            V="$NPM_LATEST"
            FORCE=false
          fi
          # Dedup by the pin, not the registry: a version is "already built"
          # exactly when the daily flow pinned it after pushing.
          if [ "$FORCE" = "false" ] && [ "$V" = "$PIN" ]; then
            echo "build=false"
            echo "npm latest $V already pinned and built, nothing to do"
            exit 0
          fi
          # Pin moves only for npm latest, so forced old versions don't churn the pin.
          if [ "$V" = "$NPM_LATEST" ] && [ "$V" != "$PIN" ]; then
            echo "bump=true" >> "$GITHUB_OUTPUT"
          fi
          # `:latest` is only in the tag list when what we build IS npm latest,
          # so a forced build of an old version never moves the moving tag.
          {
            echo "tags<<EOF"
            echo "ghcr.io/${GITHUB_REPOSITORY}:${V}"
            [ "$V" = "$NPM_LATEST" ] && echo "ghcr.io/${GITHUB_REPOSITORY}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "npm_latest=$NPM_LATEST" >> "$GITHUB_OUTPUT"
          echo "building ssh-mcp $V (npm latest: $NPM_LATEST, pinned: $PIN, forced: $FORCE)"

      - name: Set up QEMU
        if: steps.decide.outputs.build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.decide.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.decide.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.decide.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            SSH_MCP_VERSION=${{ steps.decide.outputs.version }}
          tags: ${{ steps.decide.outputs.tags }}

      - name: Pin the built version in the Dockerfile
        if: steps.decide.outputs.build == 'true' && steps.decide.outputs.bump == 'true'
        run: |
          # tag_latest gates this step, so `latest` below is the version just built.
          sed -i "s|ARG SSH_MCP_VERSION=.*|ARG SSH_MCP_VERSION=${{ steps.decide.outputs.version }}|" deploy/Dockerfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/Dockerfile
          git commit -m "chore(deps): pin ssh-mcp ${{ steps.decide.outputs.version }}" --no-verify
          git push
